name: Build macOS ARM64 dmg (self-use)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 1.1.0-v3
        uses: actions/checkout@v4
        with:
          ref: 1.1.0-v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS ARM64 package
        run: pnpm run build:mac:arm64:artifacts

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: release/1.1.0/*.dmg
          retention-days: 14
